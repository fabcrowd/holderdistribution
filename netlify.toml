# Deploys are manual-only — trigger from the Netlify dashboard.
# All git-triggered builds (production, preview, branch) are suppressed via
# ignore = "exit 0". The /data/* cache and /assets/* immutable headers below
# are the only netlify.toml rules that affect the live site at runtime.

[build]
  command = "npm run build"
  publish = "dist"

[context.production]
  ignore = "exit 0"

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
