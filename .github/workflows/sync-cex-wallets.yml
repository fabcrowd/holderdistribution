name: Sync CEX wallets from Dune

on:
  schedule:
    # 1st and 15th of each month at 01:00 UTC (~biweekly)
    - cron: '0 1 1,15 * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug from config/projects.json (scripts take --project; non-TEL runs commit public/data/<slug>/** and data/<slug>/**)'
        required: false
        default: 'tel'

permissions:
  contents: write

# Every pipeline script reads HD_PROJECT as its default `--project` (see
# scripts/lib/projects.js); scheduled runs have no inputs and stay on TEL.
env:
  HD_PROJECT: ${{ inputs.project || 'tel' }}

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve project data paths
        # HD_DATA_DIR / HD_WORK_DIR: public/data + data for TEL (unchanged),
        # public/data/<slug> + data/<slug> for any other project.
        run: node scripts/workflow-paths.js >> "$GITHUB_ENV"

      - name: Resolve projects to sync
        # Scheduled runs (no input) sync every registry project; a dispatch with
        # `project` syncs just that one. Slugs come from workflow-paths.js only.
        id: projects
        env:
          SELECTION: ${{ inputs.project || 'all' }}
        run: |
          node scripts/workflow-paths.js matrix "$SELECTION" > "$RUNNER_TEMP/matrix.json"
          SLUGS=$(node -e 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(m.include.map((p) => p.slug).join(" "))' "$RUNNER_TEMP/matrix.json")
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Import Dune spellbook CEX lists (every project)
        # Public spellbook static lists: no Dune key or credits. EVM projects merge
        # additions into their own CEX list. Projects with no EVM chain (HD_HAS_EVM
        # from config) get --candidates, which never writes a production list.
        # Non-fatal: a failure is reported by the Stage verdict step at the end.
        id: spellbook
        continue-on-error: true
        env:
          SLUGS: ${{ steps.projects.outputs.slugs }}
        run: |
          failed=""
          for slug in $SLUGS; do
            flags=$(node scripts/workflow-paths.js --project "$slug")
            args=""
            echo "$flags" | grep -qx 'HD_HAS_EVM=true' || args="--candidates"
            if ! node scripts/sync-cex-wallets-dune.js --source spellbook --project "$slug" $args; then
              echo "::error::Dune spellbook CEX import failed for $slug"
              failed="${failed:+$failed }$slug"
            fi
          done
          [ -z "$failed" ]

      - name: Sync CEX wallets from Dune
        # Single project: the one selected by the dispatch input, or TEL on a
        # schedule (HD_PROJECT above). Non-fatal, reported by the Stage verdict.
        id: dune_sync
        continue-on-error: true
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: node scripts/sync-cex-wallets-dune.js

      - name: Copy CEX wallets to public data
        run: node scripts/pull-cex-wallets.js

      - name: Re-apply the new classification to every derived feed
        # A Dune sync changes config/cex-wallets.json, which IS the non-retail
        # set — so every retail-derived feed is wrong the moment it lands.
        # Previously this workflow committed the new CEX list and stopped,
        # leaving the site serving retail computed against the OLD set until
        # the next daily run up to 23 hours later. resync-chain-holders.js is
        # the documented tool for "exclusions changed, a rescan is not
        # practical"; the rest is the standard derived chain in dependency
        # order (reconcile-supply BEFORE append-treasury-history, which reads
        # its categories).
        run: |
          node scripts/resync-chain-holders.js
          node scripts/generate-holders-lite.js
          node scripts/generate-holders-history.js
          node scripts/generate-holder-transitions.js
          node scripts/reconcile-supply.js
          node scripts/append-treasury-history.js
          node scripts/sync-classification-changelog.js

      - name: Check cross-feed consistency
        # Same gate the daily workflow runs: fail before committing rather than
        # publish feeds that disagree with each other.
        run: |
          node scripts/validate-outputs.js
          node scripts/check-feed-consistency.js

      - name: Configure git user
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

      - name: Commit updated CEX wallet list
        id: commit
        run: |
          # Each resolved project maps the TEL file list onto itself via
          # workflow-paths.js (TEL: unchanged; others: their own classification
          # CEX file, candidates file and public/data/<slug>/**). Paths that do
          # not exist are dropped, so a Solana project without a CEX list is fine.
          map_all() {
            for slug in $SLUGS; do
              for p in $(HD_PROJECT="$slug" node scripts/workflow-paths.js files "$@"); do
                [ -e "$p" ] && printf '%s\n' "$p"
              done
            done | sort -u
          }
          CHECK=$(map_all config/cex-wallets.json public/data/cex-wallets.json public/data/cex-flows.json data/cex-dune-candidates.json)
          if [ -n "$CHECK" ] && [ -n "$(git status --porcelain --untracked-files=all -- $CHECK)" ]; then
            ADDED=0
            for slug in $SLUGS; do
              CEX_CFG=$(node scripts/workflow-paths.js --project "$slug" | grep '^HD_CEX_CONFIG=' | cut -d= -f2-)
              if [ -n "$CEX_CFG" ]; then
                ADDED=$((ADDED + $(git diff -- "$CEX_CFG" | grep '^+' | grep -c '"address"' || true)))
              fi
            done
            git fetch origin main
            git rebase --autostash origin/main
            git add $(map_all config/cex-wallets.json public/data/cex-wallets.json public/data/cex-flows.json data/cex-dune-candidates.json \
              public/data/tel-holders.json public/data/holders-summary.json public/data/holders-lite.json \
              public/data/holders-history.json public/data/holder-transitions.json \
              public/data/supply-reconciliation.json public/data/treasury-history.json \
              public/data/classification-changelog.json public/data/cex-balance-history.json)
            # "[skip netlify]" — this commit lands the data but does NOT
            # publish. Netlify honours [skip ci] and [skip netlify] in the head
            # commit of a push; [skip ci] is avoided deliberately because
            # GitHub Actions honours that one too and would break the
            # workflow_run chains. The daily holders refresh publishes
            # everything committed since, so this data goes live within 24h.
            # See CLAUDE.md -> "Netlify note".
            git commit -m "chore: sync CEX wallet list from Dune (+${ADDED} addresses) [skip netlify]"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUGS: ${{ steps.projects.outputs.slugs }}

      - name: Stage verdict
        # Non-fatal stages (continue-on-error) cannot fail the run themselves, so
        # this step runs last and fails it when one failed, the same convention as
        # refresh-tel-holders.yml. Whatever succeeded is already committed above.
        if: always()
        env:
          OUTCOME_SPELLBOOK: ${{ steps.spellbook.outcome }}
          OUTCOME_DUNE_SYNC: ${{ steps.dune_sync.outcome }}
        run: |
          failed=""
          while IFS='|' read -r id var label; do
            [ -n "$id" ] || continue
            if [ "${!var}" = "failure" ]; then
              echo "::error::Stage '$id' failed: $label."
              failed="${failed:+$failed, }$id ($label)"
            fi
          done <<'STAGES'
          spellbook|OUTCOME_SPELLBOOK|Dune spellbook CEX import (CEX lists may be stale)
          dune_sync|OUTCOME_DUNE_SYNC|Dune CEX wallet sync (TEL CEX list may be stale)
          STAGES
          if [ -n "$failed" ]; then
            {
              echo "### Failed stages for sync-cex-wallets"
              echo "- $failed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Deliberately not dispatching refresh-tel-holders.yml here: it already
      # runs daily and re-reads config/cex-wallets.json fresh on every run, so
      # the newly-synced list is picked up within 24h regardless. Firing it
      # immediately would run pull-staker-balances.js a second time same-day
      # against the same free-tier Etherscan key as the 00:00 UTC cron —
      # plausible root cause of the ~400/6144 stakedBy rate-limit hit noted in
      # tasks/handoff.md. See lessons.md for the incident.
