name: Sync CEX wallets from Dune spellbook

on:
  schedule:
    # 1st and 15th of each month at 01:00 UTC (~biweekly)
    - cron: '0 1 1,15 * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug from config/projects.json (scripts take --project; non-TEL runs commit public/data/<slug>/** and data/<slug>/**)'
        required: false
        default: ''

permissions:
  contents: write

# Shared with every other writer of public/data on main. GitHub keeps one pending
# run per group: if a pending sync run is replaced, re-dispatch it by hand (its cron
# runs only on the 1st and the 15th).
concurrency:
  group: holders-refresh
  cancel-in-progress: false

# Every pipeline script reads HD_PROJECT as its default `--project` (see
# scripts/lib/projects.js); scheduled runs have no inputs and run every project
# config/nightly-jobs.json schedules for job "cex-sync" (one at a time).

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Projects scheduled for this job (config/nightly-jobs.json)
        id: matrix
        env:
          SELECTION: ${{ inputs.project }}
        run: echo "matrix=$(node scripts/workflow-paths.js matrix "$SELECTION" --job cex-sync)" >> "$GITHUB_OUTPUT"

  sync:
    name: sync ${{ matrix.slug }}
    needs: plan
    # Per matrix job; overlap with refresh-holders is prevented by the shared group.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HD_PROJECT: ${{ matrix.slug }}
      HD_JOB_ID: cex-sync
      # resync-chain-holders.js hydrates every account (HBAR: ~4.84M rows); the default heap is too small.
      NODE_OPTIONS: --max-old-space-size=8192
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve project data paths
        # HD_DATA_DIR / HD_WORK_DIR: public/data + data for TEL (unchanged),
        # public/data/<slug> + data/<slug> for any other project.
        run: node scripts/workflow-paths.js >> "$GITHUB_ENV"

      - name: Import Dune spellbook CEX list (this project)
        # Public spellbook static lists: no Dune key or credits. The script
        # decides the mode: an EVM project with a CEX file gets additions merged
        # into it; any other project gets candidates, which never writes a
        # production list. A VM with no spellbook model exits 0 with a notice.
        # Runs for this matrix job's project only (HD_PROJECT).
        # Non-fatal: a failure is reported by the Stage verdict step at the end.
        id: spellbook
        continue-on-error: true
        run: node scripts/sync-cex-wallets-dune.js --source spellbook --project "$HD_PROJECT"

      - name: Copy CEX wallets to public data
        run: node scripts/pull-cex-wallets.js

      - name: Re-apply the new classification to every derived feed
        # Skipped unless this project's CEX config changed: this workflow does no
        # scan, so re-deriving unchanged feeds only risks failing on stale input.
        # Same change detection as the commit step (git status on the config).
        # A spellbook import changes config/cex-wallets.json, which IS the non-retail
        # set — so every retail-derived feed is wrong the moment it lands.
        # Previously this workflow committed the new CEX list and stopped,
        # leaving the site serving retail computed against the OLD set until
        # the next daily run up to 23 hours later. resync-chain-holders.js is
        # the documented tool for "exclusions changed, a rescan is not
        # practical"; the rest is the standard derived chain in dependency
        # order.
        # append-treasury-history.js is deliberately NOT here: it appends one
        # dated row per pipeline run (refresh-holders.yml runs it nightly), so a
        # re-apply would add a second row for the day, and it refuses when a
        # labelled wallet is absent from a snapshot this workflow did not scan.
        run: |
          if [ -z "$HD_CEX_CONFIG" ] || [ -z "$(git status --porcelain --untracked-files=all -- "$HD_CEX_CONFIG")" ]; then
            echo "::notice::CEX config $HD_CEX_CONFIG unchanged; skipping the derived-feed re-apply."
            exit 0
          fi
          node scripts/resync-chain-holders.js
          node scripts/generate-holders-lite.js
          node scripts/generate-holders-history.js
          node scripts/generate-holder-transitions.js
          node scripts/reconcile-supply.js
          node scripts/sync-classification-changelog.js

      - name: Check cross-feed consistency
        # Same gate the daily workflow runs: fail before committing rather than
        # publish feeds that disagree with each other.
        run: |
          node scripts/validate-outputs.js
          node scripts/check-feed-consistency.js

      - name: Configure git user
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

      - name: Commit updated CEX wallet list
        id: commit
        run: |
          # Handles ONLY this matrix job's project (HD_PROJECT): the jobs run in
          # parallel and each pushes to main, so touching another project's files
          # would collide with that job's commit. workflow-paths.js maps the
          # file list onto the project: a legacy-root project keeps the root paths,
          # any other gets its own classification CEX file, candidates file and public/data/<slug>/**.
          # Paths that do not exist are dropped, so a Solana project without a CEX
          # list is fine.
          map_own() {
            for p in $(node scripts/workflow-paths.js files "$@"); do
              [ -e "$p" ] && printf '%s\n' "$p"
            done | sort -u
          }
          CHECK=$(map_own config/cex-wallets.json public/data/cex-wallets.json public/data/cex-flows.json data/cex-dune-candidates.json)
          if [ -n "$CHECK" ] && [ -n "$(git status --porcelain --untracked-files=all -- $CHECK)" ]; then
            ADDED=0
            if [ -n "$HD_CEX_CONFIG" ]; then
              ADDED=$(git diff -- "$HD_CEX_CONFIG" | grep '^+' | grep -c '"address"' || true)
            fi
            git add $(map_own config/cex-wallets.json public/data/cex-wallets.json public/data/cex-flows.json data/cex-dune-candidates.json \
              public/data/tel-holders.json public/data/holders-summary.json public/data/holders-lite.json \
              public/data/holders-history.json public/data/holder-transitions.json \
              public/data/supply-reconciliation.json public/data/treasury-history.json \
              public/data/classification-changelog.json public/data/cex-balance-history.json)
            # Conflict-marker guard: never commit a merge marker (a 2026-11-15 run
            # committed them into a data file).
            if git diff --cached -U0 | grep -E '^\+(<<<<<<<|=======|>>>>>>>)( |$)'; then
              echo "::error::Conflict markers in the staged changes; not committing."
              exit 1
            fi
            # "[skip netlify]" — this commit lands the data but does NOT
            # publish. Netlify honours [skip ci] and [skip netlify] in the head
            # commit of a push; [skip ci] is avoided deliberately because
            # GitHub Actions honours that one too and would break the
            # workflow_run chains. The daily holders refresh publishes
            # everything committed since, so this data goes live within 24h.
            # See CLAUDE.md -> "Netlify note".
            git commit -m "chore: sync CEX wallet list from Dune spellbook (+${ADDED} addresses) [skip netlify]"
            # Fetch, rebase and push with up to 5 attempts and backoff (parallel
            # jobs race); a rebase conflict aborts and fails instead of
            # committing markers.
            bash scripts/push-main.sh
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage verdict
        # Non-fatal stages (continue-on-error) cannot fail the run themselves, so
        # this step runs last and fails it when one failed, the same convention as
        # refresh-holders.yml. Whatever succeeded is already committed above.
        if: always()
        env:
          OUTCOME_SPELLBOOK: ${{ steps.spellbook.outcome }}
        run: |
          failed=""
          while IFS='|' read -r id var label; do
            [ -n "$id" ] || continue
            if [ "${!var}" = "failure" ]; then
              echo "::error::Stage '$id' failed: $label."
              failed="${failed:+$failed, }$id ($label)"
            fi
          done <<'STAGES'
          spellbook|OUTCOME_SPELLBOOK|Dune spellbook CEX import (CEX lists may be stale)
          STAGES
          if [ -n "$failed" ]; then
            {
              echo "### Failed stages for sync-cex-wallets"
              echo "- $failed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Deliberately not dispatching refresh-holders.yml here: it already
      # runs daily and re-reads config/cex-wallets.json fresh on every run, so
      # the newly-synced list is picked up within 24h regardless. Firing it
      # immediately would run pull-staker-balances.js a second time same-day
      # against the same free-tier Etherscan key as the 01:07 UTC nightly cron —
      # plausible root cause of the ~400/6144 stakedBy rate-limit hit noted in
      # tasks/handoff.md. See lessons.md for the incident.
