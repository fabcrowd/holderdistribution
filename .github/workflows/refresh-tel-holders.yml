name: Refresh holders snapshots
# THE single daily data workflow for EVERY project in config/projects.json
# (file name kept: scripts/lib/deployTriggers.test.js and the docs key on it).
# Onboarding a token is config only: add it to config/projects.json plus its
# config/projects/<slug>.json, and the next run includes it. No new workflow.
#
# Shape: `plan` reads the registry and emits the project list; `refresh` runs
# the stages once per project (HD_PROJECT=<slug>), one project at a time
# (`max-parallel: 1`), TEL first. Stage differences come from the project
# config, never from a slug check here:
#   - the EVM staker pull and the Solana staking pull are both always run and
#     each exits 0 when the project has no such staking contract;
#   - the gap fill needs EVM block lookups, so it runs only when the project
#     has an EVM chain (HD_HAS_EVM, scripts/workflow-paths.js workflowPlan);
#   - the verify list (HD_REQUIRED_FILES) and the commit message tag
#     (HD_COMMIT_TAG: only the registry default project publishes, the rest add
#     [skip netlify]) come from the same place.
# `fail-fast: false`: one project's failure never blocks the others. Each
# project's job has its own timeout (config pipeline.workflowTimeoutMinutes).
#
# Why one workflow, not one per project: every per-project workflow shared the
# `holders-refresh` concurrency group, and GitHub keeps only ONE pending run
# per group, cancelling older pending ones, so with N projects nightly runs
# were dropped. One run per night means nothing can be dropped, and a new token
# no longer needs a new workflow file.
#
# History: consolidated 2026-10-19. It used to be the first of a chain:
# scan-exchange-flows, generate-tier-outflows and fill-history-gaps each
# re-triggered off it via workflow_run AND kept their own fallback cron, and the
# watchdog re-ran the whole chain daily. That was up to 8 scheduled jobs a day
# and ~2,500 billed minutes a month on a 2,000-minute plan. Now one cron runs
# every stage in dependency order; those workflows stay as workflow_dispatch-only
# manual backfill tools.
#
# Delivery: the data commits below do NOT rebuild Netlify (netlify.toml ignores
# git builds). The live site reads public/data/* at runtime through the
# live-data function (netlify/functions/live-data.mjs), which serves the latest
# committed copy from GitHub — see docs/DEPLOYMENT.md "Live data".
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug from config/projects.json, or 'all' (non-default projects commit public/data/<slug>/** and data/<slug>/**)"
        required: false
        default: 'all'

permissions:
  contents: write
  issues: write

# Shares a group with the watchdog (which runs the same holders chain when this
# one fails) so the two never run the heavy scan, and push, at the same time.
concurrency:
  group: holders-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: List projects from config/projects.json
        id: matrix
        # Scheduled runs have no inputs -> every registered project. A broken
        # project config is skipped with a warning (never blocks the others);
        # a slug named on dispatch that is broken fails here.
        env:
          SELECTION: ${{ inputs.project }}
        run: echo "matrix=$(node scripts/workflow-paths.js matrix "$SELECTION")" >> "$GITHUB_OUTPUT"

  refresh:
    name: Refresh ${{ matrix.slug }}
    needs: plan
    runs-on: ubuntu-24.04
    # Per-project cap (config pipeline.workflowTimeoutMinutes, default 60).
    # Was unbounded (GitHub's 360-minute default). On a private repo every minute
    # is billed against the 2,000 included/month, and failing runs here burned
    # ~50 min each on a throttled fallback path (2026-10-03..13, ~600 min).
    # A healthy TEL run is ~25-35 min; a long catch-up over public RPC takes ~10 min.
    # TEL's hard cap keeps a pathological day from burning more than 1.5 h.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # One project at a time: they all push to main, and a single run is
      # cheaper to reason about than N racing rebases (scripts/push-main.sh
      # still retries a lost race against the watchdog or a human).
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Every pipeline script reads HD_PROJECT as its default `--project` (see
    # scripts/lib/projects.js).
    env:
      HD_PROJECT: ${{ matrix.slug }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve project data paths
        # HD_DATA_DIR / HD_WORK_DIR: public/data + data for TEL (unchanged),
        # public/data/<slug> + data/<slug> for any other project; plus the
        # per-project plan (HD_TICKER, HD_COMMIT_TAG, HD_HAS_EVM, HD_REQUIRED_FILES).
        run: |
          node scripts/workflow-paths.js >> "$GITHUB_ENV"
          # Every pipeline process appends its RPC call counts here (scripts/lib/rpcMetrics.js).
          echo "HD_METRICS_FILE=$RUNNER_TEMP/rpc-metrics.ndjson" >> "$GITHUB_ENV"

      - name: Refresh staker balances
        # NON-FATAL, deliberately. This step is the pipeline's heaviest RPC
        # consumer (a stakedBy() eth_call per candidate address, ~6,700 of
        # them), so it is the first thing to die when the Alchemy account hits
        # its monthly capacity limit — which is exactly what happened every day
        # from 2026-09-08 to 09-12: runs 281-285 all failed HERE, and because
        # the step was fatal, the ENTIRE holders feed stopped with it. Every
        # artifact below was still perfectly producible; none of them got
        # written, and the daily row was lost each time.
        #
        # On failure the pipeline continues against the last committed
        # funding-wallets.json — staking attribution one day stale, which is
        # precisely what a retry-tomorrow would have given anyway, and strictly
        # better than no snapshot at all. The staleness is not silent: the file
        # is a tracked feed in pipeline-health.js, so it surfaces in the
        # watchdog report and in the "Daily coverage" line rather than being
        # quietly assumed fresh.
        #
        # A project without a StakeChanged staking contract exits 0 immediately.
        id: stakers
        continue-on-error: true
        # Cap the step: it is non-fatal, so when it degrades to the throttled
        # Etherscan path it must not spend ~50 billed minutes before giving up.
        timeout-minutes: 20
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          # Lets pull-staker-balances.js's stakedBy() calls go through Alchemy
          # Polygon RPC instead of Etherscan's 3/sec-capped proxy module —
          # same decrypted .env.enc keys the next step already uses.
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: node scripts/pull-staker-balances.js

      - name: Pull Solana staking positions
        # Non-fatal: on failure the lite feed keeps the previous staking file's
        # numbers (or none) and holders still publish. Exits 0 immediately for a
        # project with no zebecStakeV1 staking entry (e.g. TEL).
        id: solana_staking
        continue-on-error: true
        timeout-minutes: 10
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          # loadEnv (scripts/decrypt-env.js) only overwrites keys that exist
          # inside .env.enc, which has no SOLANA_RPC_*, so the secret survives.
          SOLANA_RPC_0: ${{ secrets.SOLANA_RPC_0 }}
          SOLANA_RPC_1: ${{ secrets.SOLANA_RPC_1 }}
        run: node scripts/pull-solana-staking.js

      - name: Refresh holders snapshot (public RPC first)
        # Log scan. The Alchemy free tier caps eth_getLogs at 10 blocks, which
        # made this step ~23 billed minutes a day; the public nodes take wide
        # ranges. Keys are still the fallback inside getUsableRpcUrls, and the
        # step below retries entirely on keys if this one fails. The script
        # resumes from its checkpoint, so a failed attempt loses nothing.
        id: holders_public
        continue-on-error: true
        timeout-minutes: 20
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          SOLANA_RPC_0: ${{ secrets.SOLANA_RPC_0 }}
          SOLANA_RPC_1: ${{ secrets.SOLANA_RPC_1 }}
          RPC_PREFER_PUBLIC: '1'
        run: node scripts/pull-holders-rpc.js

      - name: Refresh holders snapshot (retry on keys)
        if: ${{ steps.holders_public.outcome == 'failure' }}
        timeout-minutes: 35
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          SOLANA_RPC_0: ${{ secrets.SOLANA_RPC_0 }}
          SOLANA_RPC_1: ${{ secrets.SOLANA_RPC_1 }}
        run: node scripts/pull-holders-rpc.js

      - name: Refresh CEX wallets and flows
        run: node scripts/pull-cex-wallets.js

      - name: Generate holders lite snapshot
        run: node scripts/generate-holders-lite.js

      - name: Update holders history snapshot
        run: node scripts/generate-holders-history.js

      - name: Generate holder tier transitions
        run: node scripts/generate-holder-transitions.js

      - name: Reconcile supply breakdown
        run: node scripts/reconcile-supply.js

      - name: Append today's treasury balances
        # Must run AFTER reconcile-supply.js — it reads that script's category
        # totals rather than recomputing them, so there is only one definition
        # of what counts as treasury/council/holdings/escrow. The historical
        # series itself comes from scripts/backfill-treasury-history.js (a
        # one-off Transfer-log replay); this only keeps the tail current.
        run: node scripts/append-treasury-history.js

      - name: Sync the served classification changelog
        # The app fetches public/data/classification-changelog.json, a COPY of
        # the hand-curated config/ file. Editing config/ alone leaves the UI
        # showing no reclassification marker — silently, with no error. Syncing
        # every run means the served copy can never drift.
        run: node scripts/sync-classification-changelog.js

      - name: Verify generated files
        # The list is per project (HD_REQUIRED_FILES, workflowPlan): the shared
        # set, plus funding-wallets.json for a project with a StakeChanged
        # staking contract, plus solana-staking.json for a Solana staking one.
        run: |
          for name in $HD_REQUIRED_FILES; do
            file="$HD_DATA_DIR/$name"
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file was not generated"
              exit 1
            fi
          done
          echo "All required files generated successfully"

      - name: Check cross-feed consistency
        # Shape validation (validate-outputs.js) passes when every file is
        # individually well-formed but they disagree with each other — which is
        # exactly what happened on 2026-08-29, when two feeds reported
        # 67,843,742,873 retail and three reported 66,093,742,873. This gate
        # compares every quantity carried by more than one artifact and FAILS
        # the run before the commit step, so a self-contradicting dataset is
        # never published.
        run: |
          node scripts/validate-outputs.js
          node scripts/check-feed-consistency.js

      - name: Configure git user
        run: |
          # THE daily publish. netlify.toml no longer builds on git pushes, so
          # this commit reaches the live site through the live-data function
          # (no deploy, no build credits). pipeline-health.js reports staleness.
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

      - name: Commit snapshot changes
        id: commit
        run: |
          FILES_TO_CHECK=$(node scripts/workflow-paths.js files public/data/funding-wallets.json public/data/tel-holders.json public/data/holders-summary.json public/data/holders-history.json public/data/cex-wallets.json public/data/cex-flows.json public/data/cex-balance-history.json public/data/holders-lite.json public/data/holders-checkpoint.json public/data/chain-status.json public/data/holder-transitions.json public/data/holders-ever-checkpoint.json public/data/supply-reconciliation.json public/data/treasury-history.json public/data/classification-changelog.json)

          git add $FILES_TO_CHECK
          # staker-balances-checkpoint.json only exists if pull-staker-balances.js
          # got interrupted mid-run; -A handles add/update/delete, || true
          # swallows the "no match" case when it's neither tracked nor present.
          git add -A -- "$HD_DATA_DIR/staker-balances-checkpoint.json" 2>/dev/null || true

          # git diff on the unstaged tree misses new untracked files — check
          # the staged index instead.
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # Commit locally BEFORE rebasing onto origin/main (matching every
            # other data-pipeline workflow's commit step) — rebasing staged
            # changes first via --autostash does not reliably restore staged
            # status once origin/main has moved (a real rebase, not just a
            # fast-forward), so the final `git commit` found nothing staged
            # and failed for 4 straight days (see issue #187).
            git commit -m "Refresh ${HD_TICKER} holders snapshot, summary, and CEX wallets${HD_COMMIT_TAG}"

            # pull-holders-rpc.js also writes public/data/tel-holders-previous.json
            # as a same-run scratch file (the "before this run" snapshot, used by
            # later steps to diff against) — it's deliberately not in
            # FILES_TO_CHECK and has never been committed by this workflow.
            # A plain `git rebase` refuses to run with that file still dirty, so
            # discard any leftover unstaged changes (nothing outside
            # FILES_TO_CHECK is meant to survive this run) before rebasing.
            git checkout -- .

            # fetch + rebase + push, retried on a lost race (up to 5 attempts).
            bash scripts/push-main.sh
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Stage 2: downstream feeds (formerly separate chained workflows) ----
      # They run only after the holders snapshot above committed successfully
      # (the old workflow_run guard), against that fresh classification. Each
      # is non-fatal and time-boxed: a slow scan must not eat the minute budget,
      # and its checkpoint simply resumes tomorrow. For a project with no EVM
      # chain the two scanners publish empty feeds (so the terminal shows an
      # empty state instead of a 404) and the gap fill is skipped.

      - name: Scan Solana flows
        # Writes the per-day store (data/<slug>/solana-flow-days.json) and the
        # chain checkpoint that scan-exchange-flows.js and generate-tier-outflows.js
        # publish from, so it must run first. Gated on the registry (the project
        # declares a Solana chain), not on a slug. SOLANA_RPC_* come from the
        # decrypted .env.enc. Non-fatal: it resumes from its checkpoint tomorrow.
        if: ${{ env.HD_SOLANA_FLOWS == 'true' }}
        id: solana
        continue-on-error: true
        timeout-minutes: 25
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          SOLANA_RPC_0: ${{ secrets.SOLANA_RPC_0 }}
          SOLANA_RPC_1: ${{ secrets.SOLANA_RPC_1 }}
        run: node scripts/scan-solana-flows.js

      - name: Scan exchange flows
        id: flows
        continue-on-error: true
        timeout-minutes: 25
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          RPC_PREFER_PUBLIC: '1'
        run: node scripts/scan-exchange-flows.js

      - name: Generate tier outflows
        id: tiers
        continue-on-error: true
        timeout-minutes: 25
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          RPC_PREFER_PUBLIC: '1'
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/generate-tier-outflows.js

      - name: Fill holders-history gaps
        # Uses archive-state reads, so it stays on the keys (no RPC_PREFER_PUBLIC).
        # EVM block-timestamp lookups only: skipped for a project without EVM chains.
        id: gaps
        if: ${{ env.HD_HAS_EVM == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node scripts/fill-history-gaps.js --days=14

      - name: Re-check cross-feed consistency
        run: |
          node scripts/validate-outputs.js
          node scripts/check-feed-consistency.js

      - name: Summarize RPC usage
        # Folds this job's per-process RPC counts into data/<slug>/rpc-usage.json
        # (committed below) and checks the monthly Alchemy CU / Helius credit
        # budgets in config/budgets.json. A budget breach exits 1; it is
        # non-fatal here so the feeds still commit, and fails the run afterwards.
        id: usage
        if: always()
        continue-on-error: true
        run: node scripts/summarize-run-metrics.js

      - name: Commit downstream feeds
        run: |
          FILES=$(node scripts/workflow-paths.js files public/data/exchange-flow-history.json public/data/exchange-flow-checkpoint.json public/data/tier-outflows.json data/tier-outflows-days.json data/tier-outflows-checkpoint.json data/solana-flow-days.json public/data/holders-history.json data/holders-asof-blocks.json data/rpc-usage.json)
          for f in $FILES; do [ -e "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No downstream changes to commit"
          else
            git commit -m "Daily downstream feeds: exchange flows, tier outflows, history gaps${HD_COMMIT_TAG}"
            git checkout -- .
            bash scripts/push-main.sh
          fi
          echo "solana=${{ steps.solana.outcome }} flows=${{ steps.flows.outcome }} tiers=${{ steps.tiers.outcome }} gaps=${{ steps.gaps.outcome }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage verdict
        # Non-fatal stages use continue-on-error so one failure cannot block the
        # others, which also leaves the run green. This step runs last (after the
        # feeds are committed) and fails the run if any of them failed, so
        # "Notify on failure" files the issue. Every continue-on-error step with
        # an id must be listed here (scripts/lib/stageVerdict.test.js enforces it).
        # holders_public is not listed: its failure is retried by the fatal
        # "retry on keys" step, so only the retry's result matters.
        if: always()
        env:
          OUTCOME_STAKERS: ${{ steps.stakers.outcome }}
          OUTCOME_SOLANA_STAKING: ${{ steps.solana_staking.outcome }}
          OUTCOME_SOLANA: ${{ steps.solana.outcome }}
          OUTCOME_FLOWS: ${{ steps.flows.outcome }}
          OUTCOME_TIERS: ${{ steps.tiers.outcome }}
          OUTCOME_GAPS: ${{ steps.gaps.outcome }}
          OUTCOME_USAGE: ${{ steps.usage.outcome }}
        run: |
          failed=""
          summary=""
          while IFS='|' read -r id var label; do
            [ -n "$id" ] || continue
            if [ "${!var}" = "failure" ]; then
              echo "::error::Stage '$id' failed: $label."
              failed="${failed:+$failed, }$id ($label)"
              summary="$summary- \`$id\`: $label"$'\n'
            fi
          done <<'STAGES'
          stakers|OUTCOME_STAKERS|Staker balances refresh (staking attribution is stale)
          solana_staking|OUTCOME_SOLANA_STAKING|Solana staking positions pull
          solana|OUTCOME_SOLANA|Solana flow scan (exchange and tier flows for Solana projects are stale)
          flows|OUTCOME_FLOWS|Exchange flows scan
          tiers|OUTCOME_TIERS|Tier outflows generation
          gaps|OUTCOME_GAPS|Holders-history gap fill
          usage|OUTCOME_USAGE|monthly RPC budget exceeded or usage summary crashed (config/budgets.json, see the Summarize RPC usage step)
          STAGES
          if [ -n "$failed" ]; then
            {
              echo "### Failed stages for ${HD_PROJECT}"
              printf '%s' "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FAILED_STAGES=$failed" >> "$GITHUB_ENV"
            exit 1
          fi
          echo "All non-fatal stages succeeded or were skipped."

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        env:
          TICKER: ${{ matrix.ticker }}
          FAILED_STAGES: ${{ env.FAILED_STAGES }}
        with:
          script: |
            // One issue per project; TEL's title is the one this workflow always used.
            const title = `Data pipeline failure: Refresh ${process.env.TICKER} holders snapshot`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
            });
            const match = existing.find((issue) => issue.title === title);
            const failedStages = process.env.FAILED_STAGES
              ? `\nFailed stages: ${process.env.FAILED_STAGES}`
              : "";
            const body = `Run failed: ${runUrl}${failedStages}\nTriggered: ${new Date().toISOString()}`;
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pipeline-failure"],
              });
            }
