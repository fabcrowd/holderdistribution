name: Recompute holders history from git
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recompute:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Required: recompute-history-from-git.js reads public/data/tel-holders.json
          # and public/data/cex-wallets.json from arbitrary past commits via `git show`.
          # The default shallow checkout (depth 1) would make every historical blob
          # lookup fail.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Recompute holders-history.json and cex-balance-history.json
        # Pure git + local computation — no RPC calls, no secrets needed.
        run: node scripts/recompute-history-from-git.js
      - name: Configure git user
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
      - name: Commit recomputed history
        id: commit
        run: |
          # recompute-history-from-git.js writes three files — holders-ever-checkpoint.json
          # (the running "ever held" address set) must be staged alongside the other two or
          # its corrections are silently dropped every run and generate-holders-history.js's
          # daily incremental script keeps building on a stale checkpoint.
          git add public/data/holders-history.json public/data/cex-balance-history.json public/data/holders-ever-checkpoint.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Recompute holders-history.json and cex-balance-history.json from git"
            # Rebase onto whatever landed on main since checkout — other scheduled
            # workflows push to main too, so a plain push here can be rejected as
            # non-fast-forward. Matches the pattern already used by
            # refresh-tel-holders.yml / backfill-dex-liquidity-history.yml.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No explicit deploy step: the push to main above is itself the deploy
      # trigger. netlify.toml has no build.ignore rule, so Netlify's native git
      # auto-deploy publishes every commit that lands on main. See netlify.toml
      # and lessons.md → "Netlify Deployment" before adding a hook back.
