name: Generate tier outflows

# Attributes each retail balance tier's outgoing TEL to a destination class
# (sold on DEX / sent to exchange / moved to another wallet) by scanning TEL
# Transfer logs. Resumable: each run advances the per-chain checkpoint by up to
# MAX_BLOCKS_PER_RUN blocks, so a full backfill completes over several runs.
# Trigger manually; re-run until "complete=true" appears.
on:
  # MANUAL ONLY since 2026-10-19: the daily run of this stage is a step in
  # refresh-tel-holders.yml (the single scheduled data workflow), so it no
  # longer needs its own workflow_run chain or fallback cron, each of which
  # was a second billed run a day. Dispatch this for a bigger backfill.
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug from config/projects.json (scripts take --project; only TEL is pipeline-ready today)'
        required: false
        default: 'tel'
      max_blocks_per_run:
        description: 'Max blocks to scan per chain this run'
        required: false
        default: '3000000'

permissions:
  contents: write
  issues: write

concurrency:
  group: generate-tier-outflows
  cancel-in-progress: false

# Every pipeline script reads HD_PROJECT as its default `--project` (see
# scripts/lib/projects.js); scheduled runs have no inputs and stay on TEL.
env:
  HD_PROJECT: ${{ inputs.project || 'tel' }}

jobs:
  scan:
    # Skip when the upstream run failed or was cancelled — see scan-exchange-flows.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # See scan-exchange-flows: workflow_run would otherwise check out the
          # pre-upstream-commit SHA and scan against stale classification.
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate tier outflows
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          MAX_BLOCKS_PER_RUN: ${{ github.event.inputs.max_blocks_per_run }}
          # Larger heap for the one-time full-year rebuild (fan-out tracking
          # holds a per-(day,sender) map for the scanned span).
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/generate-tier-outflows.js

      - name: Commit results
        id: commit
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          FILES="public/data/tier-outflows.json data/tier-outflows-days.json data/tier-outflows-checkpoint.json"
          git add $FILES
          # git diff misses new untracked files — check the staged index instead.
          if git diff --cached --quiet -- $FILES; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # "[skip netlify]" — this commit lands the data but does NOT
            # publish. Netlify honours [skip ci] and [skip netlify] in the head
            # commit of a push; [skip ci] is avoided deliberately because
            # GitHub Actions honours that one too and would break the
            # workflow_run chains. The daily holders refresh publishes
            # everything committed since, so this data goes live within 24h.
            # See CLAUDE.md -> "Netlify note".
            git commit -m "Update tier-outflow scan (resumable backfill) [skip netlify]"
            git fetch origin ${GITHUB_REF_NAME}
            git rebase origin/${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # No explicit deploy step: the push to main above is itself the deploy
      # trigger. netlify.toml has no build.ignore rule, so Netlify's native git
      # auto-deploy publishes every commit that lands on main. See netlify.toml
      # and lessons.md → "Netlify Deployment" before adding a hook back.

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Data pipeline failure: Generate tier outflows";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
            });
            const match = existing.find((issue) => issue.title === title);
            const body = `Run failed: ${runUrl}\nTriggered: ${new Date().toISOString()}`;
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pipeline-failure"],
              });
            }
