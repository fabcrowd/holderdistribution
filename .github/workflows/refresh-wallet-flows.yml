name: Refresh gated wallet-flows report (optional)

# Regenerates the gated "Wallet flows" report for every project with a forensics registry
# (config/nightly-jobs.json job "wallet-flows"; today TEL, ZBCN, ONDO) — TEL:
# data/forensics/wallet-flows.json, others: data/<slug>/forensics/wallet-flows.json
# (served only by the forensics gate function, never from public/data). A project
# without data/<slug>/forensics/wallet-flows.registry.json is skipped (exit 0).
#
# DAILY (the 24h window needs it). One run is ~15-20 Actions minutes; the repo is
# public, so Actions minutes are free and there is no minutes budget to fit.
#
# NON-FATAL: the script keeps the previous report on any error and exits 0, and
# this job is continue-on-error, so it can never break or block other workflows.
# It does not trigger a Netlify build (netlify.toml ignores git pushes); with
# LIVE_DATA_GITHUB_TOKEN set in Netlify, the gate serves the new file within an hour.
#
# A project with a Solana chain also runs generate-wallet-flows-solana.js in this job
# (Helius credits, capped per run, a few minutes); it has no schedule of its own.

on:
  schedule:
    - cron: '41 13 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug from config/projects.json (scheduled runs: every project config/nightly-jobs.json schedules for wallet-flows). Needs that project''s forensics registry.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: holders-refresh
  cancel-in-progress: false

# Every pipeline script reads HD_PROJECT as its default `--project` (see
# scripts/lib/projects.js). Scheduled runs have no inputs and run every planned
# project one at a time (max-parallel 1, so the commits never race); a manual run
# does only the project it names. ONDO is skipped (exit 0) until its holders
# feed has produced supply-reconciliation.json.
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Projects scheduled for this job (config/nightly-jobs.json)
        id: matrix
        env:
          SELECTION: ${{ inputs.project }}
        run: echo "matrix=$(node scripts/workflow-paths.js matrix "$SELECTION" --job wallet-flows)" >> "$GITHUB_OUTPUT"

  wallet-flows:
    name: wallet-flows (${{ matrix.slug }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HD_PROJECT: ${{ matrix.slug }}
      HD_JOB_ID: wallet-flows
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Project paths
        run: node scripts/workflow-paths.js >> "$GITHUB_ENV"
      - name: Generate report (keeps previous file on failure)
        env:
          RPC_PREFER_PUBLIC: '1'
        run: node scripts/generate-wallet-flows.js
      - name: Generate Solana report (keeps previous file on failure)
        env:
          SOLANA_RPC_0: ${{ secrets.SOLANA_RPC_0 }}
          SOLANA_RPC_1: ${{ secrets.SOLANA_RPC_1 }}
        run: node scripts/generate-wallet-flows-solana.js
      - name: Commit if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          # TEL: data/forensics/wallet-flows.json (unchanged); others: data/<slug>/forensics/…
          FILES=$(node scripts/workflow-paths.js files data/forensics/wallet-flows.json)
          if [ -z "$FILES" ]; then echo "No report for $HD_PROJECT_SLUG"; exit 0; fi
          # Solana scan state (cursors + 90-day events) is written only by the Solana generator; the
          # TEL pass-through of workflow-paths.js does not check existence, so add it only when present.
          STATE="$HD_WORK_DIR/forensics/wallet-flows-state.json"
          if [ -f "$STATE" ]; then FILES="$FILES $STATE"; fi
          git add $FILES
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh gated wallet-flows report [skip netlify]"
          git checkout -- .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
