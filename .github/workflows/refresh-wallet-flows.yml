name: Refresh gated wallet-flows report (optional)

# Regenerates the gated "Wallet flows" report for one project — TEL:
# data/forensics/wallet-flows.json, others: data/<slug>/forensics/wallet-flows.json
# (served only by the forensics gate function, never from public/data). A project
# without data/<slug>/forensics/wallet-flows.registry.json is skipped (exit 0).
#
# WEEKLY, NOT DAILY, on purpose: one run is ~15-20 billed minutes on the keyless
# public RPCs (90-day log scans on three chains + a full 72h transfer scan). Daily
# would add ~450-600 min/month on top of the daily pipeline's ~500-900, too close
# to the 2,000 free minutes. Weekly adds ~80. Run it by hand for a fresh 72h view.
#
# NON-FATAL: the script keeps the previous report on any error and exits 0, and
# this job is continue-on-error, so it can never break or block other workflows.
# It does not trigger a Netlify build (netlify.toml ignores git pushes); with
# LIVE_DATA_GITHUB_TOKEN set in Netlify, the gate serves the new file within an hour.

on:
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug from config/projects.json (scheduled runs: tel). Needs that project''s forensics registry.'
        required: false
        default: 'tel'

permissions:
  contents: write

concurrency:
  group: holders-refresh
  cancel-in-progress: false

# Every pipeline script reads HD_PROJECT as its default `--project` (see
# scripts/lib/projects.js); scheduled runs have no inputs and stay on TEL.
env:
  HD_PROJECT: ${{ inputs.project || 'tel' }}

jobs:
  wallet-flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Project paths
        run: node scripts/workflow-paths.js >> "$GITHUB_ENV"
      - name: Generate report (keeps previous file on failure)
        env:
          RPC_PREFER_PUBLIC: '1'
        run: node scripts/generate-wallet-flows.js
      - name: Commit if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          # TEL: data/forensics/wallet-flows.json (unchanged); others: data/<slug>/forensics/…
          FILES=$(node scripts/workflow-paths.js files data/forensics/wallet-flows.json)
          if [ -z "$FILES" ]; then echo "No report for $HD_PROJECT_SLUG"; exit 0; fi
          git add $FILES
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh gated wallet-flows report [skip netlify]"
          git checkout -- .
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
