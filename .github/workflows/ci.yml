name: CI

# Quality gate for code changes. Deliberately NOT triggered by the data-refresh
# commits the pipeline pushes to main (paths-ignore below), and it never deploys:
# production deploys are manual from the Netlify dashboard (see docs/DEPLOYMENT.md).

on:
  pull_request:
    paths-ignore:
      - "data/**"
      - "public/data/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/data/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # NODE_OPTIONS: check:feeds loads every project's snapshot (HBAR: ~4.84M rows);
    # Node's default old-space limit is too small.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Same validators the nightly pipeline ends with, over the committed public/data of every
      # registered project: a config/ or scripts/ change that would fail the nightly fails here.
      - run: npm run check:feeds
      # Every file a coin writes is stored or excluded by the store (the nightly pack fails the coin otherwise). Offline, committed data.
      - run: npm run check:store-files
      # The tests that assert the committed data itself (scripts/datachecks, src/datachecks), every project.
      - run: npm run check:data
      - run: npm run build
      - name: Dependency audit (production deps, informational)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
