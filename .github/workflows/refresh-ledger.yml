name: Refresh developer-wallet ledger (gated)

# Nightly developer-wallet ledger for EVERY project in config/projects.json that
# has config/projects/<slug>/ledger.json (others exit 0 with a notice):
#   scripts/build-ledger.js        -> data/<slug>/ledger/ledger.json (+ ledger-checkpoint.json)
#   scripts/trace-bot-proceeds.js  -> data/<slug>/ledger/bot-proceeds.json
# Served ONLY by the forensics gate function (keys "project-ledger" / "bot-proceeds"),
# never from public/data. See docs/LEDGER.md.
#
# Runs at 07:30 UTC, after the 06:00 (1am EST) refresh-holders run has normally finished.
# Own concurrency group (not holders-refresh): GitHub keeps only one PENDING run per
# group, so sharing it could drop the nightly holders run. Pushes go through
# scripts/push-main.sh, which retries a lost race. Commits carry [skip netlify].
#
# Runtime: incremental after the first run (checkpointed per chain), ~3-8 minutes
# per project per night; the first run backfills 90 days and takes longer. The
# repo is public, so Actions minutes are free (no minutes budget). Providers: Alchemy (decrypted from
# .env.enc via ENV_PASSPHRASE) for EVM, Etherscan free tier as a count cross-check,
# SOLANA_RPC_0 (Helius) / SOLANA_RPC_1 (public) for Solana.
#
# A chain that fails keeps its previous data and is marked stale. The last steps
# turn the project's job red on a failed bot trace or a missing or stale ledger.
# fail-fast is off, so other projects still run.

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug from config/projects.json, or 'all'"
        required: false
        default: 'all'
      rebuild:
        description: 'Ignore the checkpoint and rescan the full history window'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: ledger-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: List projects from config/projects.json
        id: matrix
        env:
          SELECTION: ${{ inputs.project }}
        run: echo "matrix=$(node scripts/workflow-paths.js matrix "$SELECTION" --job ledger)" >> "$GITHUB_OUTPUT"

  ledger:
    name: Ledger ${{ matrix.slug }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HD_PROJECT: ${{ matrix.slug }}
      # config/nightly-jobs.json "ledger": public eth_getLogs first, Alchemy last,
      # 0 Alchemy CU budget (enforced), so the nightly ledger spends no CU.
      HD_JOB_ID: ledger
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve project data paths
        run: |
          node scripts/workflow-paths.js >> "$GITHUB_ENV"
          echo "HD_METRICS_FILE=$RUNNER_TEMP/rpc-metrics.ndjson" >> "$GITHUB_ENV"
      - name: Skip projects without a ledger config
        id: has
        run: |
          if [ -f "config/projects/$HD_PROJECT_SLUG/ledger.json" ]; then echo "run=1" >> "$GITHUB_OUTPUT";
          else echo "::notice::no config/projects/$HD_PROJECT_SLUG/ledger.json; skipping"; fi
      - name: Build ledger (keeps previous data per chain on failure)
        if: steps.has.outputs.run == '1'
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOLANA_RPC_0: ${{ secrets.SOLANA_RPC_0 }}
          SOLANA_RPC_1: ${{ secrets.SOLANA_RPC_1 }}
        run: node scripts/build-ledger.js --project "$HD_PROJECT_SLUG" ${{ inputs.rebuild == 'true' && '--rebuild' || '' }}
      - name: Trace bot proceeds
        id: trace
        if: steps.has.outputs.run == '1'
        continue-on-error: true
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: node scripts/trace-bot-proceeds.js --project "$HD_PROJECT_SLUG"
      - name: Record RPC usage
        if: steps.has.outputs.run == '1'
        continue-on-error: true
        run: node scripts/summarize-run-metrics.js
      - name: Commit if changed
        if: steps.has.outputs.run == '1'
        run: |
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"
          DIR="data/$HD_PROJECT_SLUG/ledger"
          if [ ! -d "$DIR" ]; then echo "No ledger output for $HD_PROJECT_SLUG"; exit 0; fi
          git add "$DIR"
          if [ -f "$HD_WORK_DIR/rpc-usage.json" ]; then git add "$HD_WORK_DIR/rpc-usage.json"; fi
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh $HD_PROJECT_SLUG developer-wallet ledger [skip netlify]"
          git checkout -- .
          bash scripts/push-main.sh
      - name: Verify ledger
        run: node scripts/check-go-live.js --project "$HD_PROJECT_SLUG" --section ledger
      - name: Fail on a failed bot trace
        if: steps.trace.outcome == 'failure'
        run: |
          echo "::error::trace-bot-proceeds failed for $HD_PROJECT_SLUG"
          exit 1
