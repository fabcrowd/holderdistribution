name: Onboard a project (first data to go-live)

# One dispatch takes a project whose scaffold is merged to main (npm run onboard
# -- --write, reviewed, merged) through every first-data step in order, waiting
# for each workflow it dispatches: CEX list, snapshot, its own holder tiers,
# history backfill, exchange flows, treasury/CEX history, tier outflows, staker
# balances, wallet flows, ledger, then check-go-live. scripts/onboard-run.js
# decides each step from the files on main, so a rerun resumes where the last
# one stopped; near the job limit it dispatches its own next round.
#
# Config edits it makes (derived tiers, the Developer wallets tab, clearing the
# registry's onboarding flag once go-live passes) are committed with
# [skip netlify]. Nothing reaches the site until a manual Netlify deploy.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug from config/projects.json (scaffolded and merged to main)"
        required: true
        type: string
      round:
        description: "Internal: which self-dispatched round this is (leave 1)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  actions: write

# Not the shared holders-refresh group: this job dispatches and waits on the
# workflows in that group, so joining it would deadlock. One run per project.
concurrency:
  group: onboard-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Drive onboarding
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # Inputs reach the shell through env, never interpolated into the script text.
          PROJECT: ${{ inputs.project }}
          ROUND: ${{ inputs.round }}
        run: >-
          node scripts/onboard-run.js --project "$PROJECT"
          --round "$ROUND" --budget-min 320
          --commit --redispatch --push-cmd "bash scripts/push-main.sh"
