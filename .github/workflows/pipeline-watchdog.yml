name: Pipeline watchdog (self-heal stale feeds)

# Durable, independent-of-any-Claude-session redundancy for the daily chain
# (refresh-tel-holders -> scan-exchange-flows -> generate-tier-outflows).
# Runs on its OWN schedule rather than workflow_run off any of them, so a
# failure anywhere in that chain — a transient RPC error, a rate limit, a
# script bug — does not also take this out. Reuses only already-proven paths:
# the exact daily pipeline commands for holders, and the ENV_PASSPHRASE-only
# cached-transfer replay (scripts/pipeline-health.js's own fallback recipe,
# verified this session: 44 requests instead of the capped scanner's ~96,000)
# for exchange flows.
#
# HARD LIMIT, STATED ONCE: if GitHub Actions itself is blocked at the account
# level (the failure this repo actually hit on 2026-08-29 — every workflow
# failing in 3-5s with no logs, including ones touching no chain data), this
# workflow does not run either. Nothing hosted by Actions can substitute for
# Actions being down; only re-enabling it (a billing/spending-limit fix) closes
# that case. What this workflow DOES guarantee, durably, independent of any
# session: if Actions is working at all, a feed going stale for any other
# reason gets a second, independent chance to self-heal every 6 hours, and if
# it still can't (tier-outflows, cex-wallets — no credential-free/session-free
# fallback exists for either), a GitHub issue records exactly that.

on:
  schedule:
    # Daily, not 6-hourly (changed 2026-09-13). At */6 this could publish four
    # times in a day on its own, which defeats "one deploy a day" whenever a
    # feed goes stale — exactly the situation where builds are most likely to
    # be failing anyway. Daily still bounds a failed nightly refresh to ~24h,
    # and this workflow only commits when it actually heals something.
    # Daily again (2026-10-28). It was weekly from 2026-10-19 to save the ~50
    # billed minutes a failure-day self-heal costs, but a weekly cadence let a
    # dead feed (and the Oct 13-25 Actions billing block) go unnoticed for up to
    # 7 days. A healthy day is just npm ci + two cheap read-only steps; the heavy
    # self-heal chain still only runs for a feed that is actually stale.
    - cron: '23 12 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project slug from config/projects.json (scripts take --project; non-TEL runs commit public/data/<slug>/** and data/<slug>/**)'
        required: false
        default: 'tel'

permissions:
  contents: write
  issues: write
  # Read-only: the run-health step lists workflow runs and their jobs.
  actions: read

# Same group as refresh-tel-holders.yml: both run the holders chain and push.
concurrency:
  group: holders-refresh
  cancel-in-progress: false

# Every pipeline script reads HD_PROJECT as its default `--project` (see
# scripts/lib/projects.js); scheduled runs have no inputs and stay on TEL.
env:
  HD_PROJECT: ${{ inputs.project || 'tel' }}

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    # Was unbounded (360-minute default); failing runs burned ~50 billed minutes
    # each on a throttled fallback path.
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve project data paths
        # HD_DATA_DIR / HD_WORK_DIR: public/data + data for TEL (unchanged),
        # public/data/<slug> + data/<slug> for any other project.
        run: node scripts/workflow-paths.js >> "$GITHUB_ENV"

      - name: Check pipeline health
        id: health_before
        # `|| true`: a stale feed makes this exit 1, which must not fail the
        # job — the whole point is to act on that, not stop at it.
        # Self-heal targets HD_PROJECT only; monitoring of every project is the
        # "Re-check" step below.
        run: node scripts/pipeline-health.js --project "$HD_PROJECT" --json > /tmp/health-before.json || true

      - name: Decide what needs self-healing
        id: decide
        run: |
          node -e '
            const r = require("/tmp/health-before.json");
            const stale = (f) => r.results.find((x) => x.file === f)?.status !== "healthy";
            const out = process.env.GITHUB_OUTPUT;
            const fs = require("node:fs");
            fs.appendFileSync(out, `holders=${stale("holders-lite.json")}\n`);
            fs.appendFileSync(out, `flows=${stale("exchange-flow-history.json")}\n`);
            fs.appendFileSync(out, `unfixable=${stale("tier-outflows.json") || stale("cex-wallets.json")}\n`);
            // Freshness is not completeness: a day the pipeline never ran for
            // leaves a permanent hole while every feed still reads healthy.
            fs.appendFileSync(out, `gaps=${(r.gaps?.missing?.length ?? 0) > 0}\n`);
            console.log(JSON.stringify(r.results.map((x) => [x.file, x.status])));
          '

      # --- Holders chain: identical to refresh-tel-holders.yml's own steps.
      # This is deliberately NOT a different recipe — if the primary workflow
      # failed on a transient error, running the exact same trusted commands a
      # second time is the safest possible self-heal.
      - name: Self-heal holder snapshot (if stale)
        if: steps.decide.outputs.holders == 'true'
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: |
          # Non-fatal for the same reason refresh-tel-holders.yml makes it
          # non-fatal: it is the heaviest RPC consumer here and the first
          # casualty of an Alchemy monthly-capacity limit, and losing it should
          # cost one day of staking freshness, not the entire self-heal.
          node scripts/pull-staker-balances.js || echo "staker balances failed — continuing with the last committed funding-wallets.json"
          node scripts/pull-holders-rpc.js
          node scripts/pull-cex-wallets.js
          node scripts/generate-holders-lite.js
          node scripts/generate-holders-history.js
          node scripts/generate-holder-transitions.js
          node scripts/reconcile-supply.js
          node scripts/append-treasury-history.js

      # --- Exchange flows: the ENV_PASSPHRASE-only cached-replay path, not the
      # 10-block-capped eth_getLogs scanner (scan-exchange-flows.js) — see
      # extend-transfer-caches.js's header for why that path is ~2,000x more
      # requests for the same result.
      - name: Self-heal exchange flow history (if stale)
        if: steps.decide.outputs.flows == 'true'
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: |
          node scripts/extend-transfer-caches.js
          node scripts/append-exchange-flows-from-cache.js

      # --- Missing dates: the same driver the dedicated "Fill holders-history
      # gaps" workflow runs. Redundancy on the same 6-hourly cadence as every
      # other self-heal here, for the same reason — if that workflow failed on a
      # transient error, running its exact command again is the safest retry.
      # It restores the live snapshot artifacts itself, including on error.
      - name: Self-heal missing history dates (if any)
        if: steps.decide.outputs.gaps == 'true'
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: node scripts/fill-history-gaps.js

      - name: Re-sync served classification changelog
        if: steps.decide.outputs.holders == 'true' || steps.decide.outputs.flows == 'true' || steps.decide.outputs.gaps == 'true'
        run: node scripts/sync-classification-changelog.js

      - name: Check cross-feed consistency
        if: steps.decide.outputs.holders == 'true' || steps.decide.outputs.flows == 'true' || steps.decide.outputs.gaps == 'true'
        # Refuses to commit a self-heal that left feeds disagreeing with each
        # other — same gate the primary workflow runs, same reasoning: shape
        # validation alone would pass a self-contradicting dataset.
        run: |
          node scripts/validate-outputs.js
          node scripts/check-feed-consistency.js

      - name: Configure git user
        if: steps.decide.outputs.holders == 'true' || steps.decide.outputs.flows == 'true' || steps.decide.outputs.gaps == 'true'
        run: |
          # Publishes (no [skip netlify]). This commit only happens when a
          # feed was actually stale, which is precisely the case where the
          # daily publish did not run or did not fix things — so this is the
          # backstop that keeps a failed daily refresh from freezing
          # production for more than six hours.
          git config user.email "action@github.com"
          git config user.name "github-actions[bot]"

      - name: Commit self-heal changes
        if: steps.decide.outputs.holders == 'true' || steps.decide.outputs.flows == 'true' || steps.decide.outputs.gaps == 'true'
        run: |
          FILES_TO_CHECK=$(node scripts/workflow-paths.js files public/data/funding-wallets.json public/data/tel-holders.json public/data/holders-summary.json public/data/holders-history.json public/data/cex-wallets.json public/data/cex-flows.json public/data/cex-balance-history.json public/data/holders-lite.json public/data/holders-checkpoint.json public/data/chain-status.json public/data/holder-transitions.json public/data/holders-ever-checkpoint.json public/data/supply-reconciliation.json public/data/treasury-history.json public/data/classification-changelog.json public/data/exchange-flow-history.json public/data/exchange-flow-checkpoint.json public/data/date-blocks.json)

          git add $FILES_TO_CHECK
          git add -A -- "$HD_WORK_DIR/holders-asof-blocks.json" 2>/dev/null || true
          git add -A -- "$HD_DATA_DIR/staker-balances-checkpoint.json" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Pipeline watchdog: self-heal stale feed(s)"
            git checkout -- .
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-check pipeline health after self-heal
        id: health_after
        # Every project in config/projects.json (derived by the script, no slug list here).
        run: node scripts/pipeline-health.js --all --json > /tmp/health-after.json || true

      - name: File or update an issue for anything still stale
        # Fires whenever health_after still shows a problem — including the
        # "unfixable" case (tier-outflows, cex-wallets) where no self-heal was
        # even attempted above. This is the durable version of "trigger a note
        # to run it in this environment": a GitHub issue, filed by a workflow
        # independent of any Claude session, visible to whoever looks next.
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/health-after.json", "utf8"));
            if (report.healthy) return;

            // Placeholder feeds (intentional stubs) are not a problem.
            const stale = report.projects.flatMap((p) => [
              ...p.results.filter((r) => r.status !== "healthy" && r.status !== "placeholder").map((r) => ({ ...r, project: p.slug })),
              ...(p.error ? [{ project: p.slug, label: "project config", file: "config/projects", status: p.error, ageMs: null }] : []),
            ]);
            const title = "Pipeline feeds stale after watchdog self-heal";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Watchdog run: ${runUrl}`,
              `Checked: ${report.generatedAt}`,
              "",
              "Still stale after this run's self-heal attempt:",
              ...stale.map((r) => `- [${r.project}] **${r.label}** (${r.file}): ${r.status}` + (r.ageMs != null ? `, ${(r.ageMs / 3600000).toFixed(1)}h old` : "")),
              "",
              "If this repeats across runs, check Actions → recent runs across ALL workflows: " +
                "if unrelated workflows are also failing in a few seconds with no logs, this is an " +
                "account-level Actions block (billing/spending limit), not a data problem — nothing " +
                "hosted by Actions, including this watchdog, can self-heal that. It needs a human to " +
                "clear the block.",
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-stale",
            });
            const match = existing.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["pipeline-stale"] });
            }

      - name: Detect data workflows that never started (billing block)
        # An account-level Actions block ("recent account payments have failed")
        # fails every job in seconds with ZERO completed steps and no logs
        # (2026-10-13..25: nothing alerted). A data workflow's latest scheduled
        # run that ended failure/startup_failure with no completed step in any
        # job is that signature, not a script bug. Fails this job (and files an
        # issue) so it surfaces like every other watchdog finding. Only useful
        # once Actions is running again: while blocked, this job cannot run
        # either (see header), so pair it with `npm run pipeline:health` run
        # from outside Actions.
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, per_page: 100 });
            const latest = new Map();
            for (const run of data.workflow_runs) {
              // Data workflows are the unattended ones; skip this watchdog's own run.
              if (!["schedule", "workflow_run"].includes(run.event) || run.id === context.runId) continue;
              if (!latest.has(run.workflow_id)) latest.set(run.workflow_id, run); // newest first
            }
            const dead = [];
            for (const run of latest.values()) {
              if (!["failure", "startup_failure"].includes(run.conclusion)) continue;
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id, per_page: 100 });
              const ranSteps = jobs.jobs.some((j) => (j.steps ?? []).some((s) => s.status === "completed" && s.conclusion !== "skipped"));
              if (!ranSteps) dead.push(run);
            }
            if (dead.length === 0) return;

            const title = "Data workflows are not starting (Actions billing/startup block?)";
            const body = [
              "These data workflows' latest run failed with zero completed steps, which is the signature of an account-level Actions block, not a script error:",
              "",
              ...dead.map((r) => `- **${r.name}** (${r.event}, ${r.created_at}): ${r.html_url}`),
              "",
              "Check Settings > Billing and plans (failed payment / spending limit). Until it is cleared no feed in any registered project will refresh.",
            ].join("\n");
            const { data: existing } = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "pipeline-failure" });
            const match = existing.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.createComment({ owner, repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ["pipeline-failure"] });
            }
            core.setFailed(`${dead.length} data workflow(s) did not start: ${dead.map((r) => r.name).join(", ")}`);

      - name: Notify on job failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Data pipeline failure: Pipeline watchdog";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
            });
            const match = existing.find((issue) => issue.title === title);
            const body = `Run failed: ${runUrl}\nTriggered: ${new Date().toISOString()}`;
            if (match) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["pipeline-failure"] });
            }
